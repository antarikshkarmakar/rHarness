[package]
name = "mythos-harness-web"
version = "1.0.0"
edition = "2021"
description = "Web UI for rHarness"
license = "MIT"

[dependencies]
anyhow = { version = "1.0", workspace = true }
axum = { version = "0.7", features = ["macros", "json", "ws"], workspace = true }
futures = { version = "0.3", workspace = true }
chrono = { version = "0.4", features = ["serde"], workspace = true }
serde = { version = "1.0", features = ["derive"], workspace = true }
serde_json = { version = "1.0", workspace = true }
thiserror = { version = "1.0", workspace = true }
tokio = { version = "1.40", features = ["full"], workspace = true }
tokio-tungstenite = { version = "0.21", features = ["native-tls"], workspace = true }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"], workspace = true }
tracing = { version = "0.1", workspace = true }
uuid = { version = "1.8", features = ["v4", "serde", "fast-rng"], workspace = true }

mythos-harness-core = { path = "../core" }

[dev-dependencies]
tokio-test = { version = "0.4", workspace = true }